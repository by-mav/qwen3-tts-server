version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    assignees: [rafamav]
    groups:
      docker-compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  # Coolify build usa Containerfile; o ecossistema docker do Dependabot
  # reconhece Dockerfile e Containerfile (dependabot-core docker file_fetcher).
  - package-ecosystem: docker
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    assignees: [rafamav]
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    assignees: [rafamav]
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    assignees: [rafamav]
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
